# Crossover — isolated stack for a server that ALREADY runs another project
# (transyol) whose Caddy owns :80/:443.
#
# Isolation:
#   * Project name `crossover` prefixes everything (crossover-db-1, crossover_pgdata...).
#   * Own Postgres — separate container/volume/credentials from transyol's DB.
#   * No host ports published here -> zero chance of clashing with transyol.
#   * The app joins transyol's existing `shared-net` ONLY so transyol-caddy can
#     reverse-proxy 168-222-180-190.nip.io -> crossover-app-1:8080. Nothing else
#     is shared; the DB sits on a private `internal` network transyol can't see.
name: crossover

services:
  db:
    image: postgres:16-alpine
    container_name: crossover-db-1
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crossover}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-crossover}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Auto-loaded ONLY on a fresh volume (full dump from the old AWS server).
      - ./deploy/seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crossover} -d ${POSTGRES_DB:-crossover}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal

  app:
    build: ./server
    image: crossover-app:latest
    container_name: crossover-app-1
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-crossover}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-crossover}
      WIKIDATA_USER_AGENT: ${WIKIDATA_USER_AGENT:-CrossoverGame/1.0 (prod; yagizkarabulutmedya@gmail.com)}
      IAP_SHARED_SECRET: ${IAP_SHARED_SECRET:-}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-com.crossover.football}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      VERIFY_MATCH_THRESHOLD: ${VERIFY_MATCH_THRESHOLD:-0.3}
      VERIFY_EXACT_THRESHOLD: ${VERIFY_EXACT_THRESHOLD:-0.85}
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-0}
      MIN_IOS_BUILD: ${MIN_IOS_BUILD:-1}
      MIN_ANDROID_VERSION_CODE: ${MIN_ANDROID_VERSION_CODE:-1}
      PUSH_ENABLED: ${PUSH_ENABLED:-1}
      DB_POOL_MAX: ${DB_POOL_MAX:-30}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-30000}
      # Hybrid real-player-first matchmaking. Defaults keep bot safety active.
      HYBRID_MATCHMAKING_ENABLED: ${HYBRID_MATCHMAKING_ENABLED:-1}
      BOT_FALLBACK_ENABLED: ${BOT_FALLBACK_ENABLED:-1}
      BOT_FALLBACK_PERCENTAGE: ${BOT_FALLBACK_PERCENTAGE:-100}
      BOT_FALLBACK_MIN_DELAY_MS: ${BOT_FALLBACK_MIN_DELAY_MS:-1800}
      BOT_FALLBACK_MAX_DELAY_MS: ${BOT_FALLBACK_MAX_DELAY_MS:-3800}
      REAL_PLAYER_SEARCH_WINDOW_MS: ${REAL_PLAYER_SEARCH_WINDOW_MS:-1200}
      EXPANDED_SEARCH_WINDOW_MS: ${EXPANDED_SEARCH_WINDOW_MS:-2500}
      INITIAL_TROPHY_RANGE: ${INITIAL_TROPHY_RANGE:-100}
      EXPANDED_TROPHY_RANGE: ${EXPANDED_TROPHY_RANGE:-450}
      MATCHMAKING_TIMEOUT_MS: ${MATCHMAKING_TIMEOUT_MS:-15000}
      HUMAN_LIQUIDITY_HOLD_MS: ${HUMAN_LIQUIDITY_HOLD_MS:-6500}
      BOT_FALLBACK_RETRY_MS: ${BOT_FALLBACK_RETRY_MS:-700}
      # Admin panel (admin.crossoverfootball.com) bearer token. Empty = admin API off.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal      # reach own Postgres
      - shared-net    # be reachable by transyol-caddy for TLS termination

networks:
  internal:
  # transyol's pre-existing external bridge network (carries the proxy traffic).
  shared-net:
    external: true

volumes:
  pgdata:
