# CrossOver Football — static site server config for the crossover-web-1 container.
#
# Without this file nginx serves the site with its own grey 404 page and with no
# cache headers at all, so every repeat visit re-downloads the fonts and CSS.
#
# Install (isolated container, touches no other project):
#
#   scp deploy/nginx-crossover-web.conf root@168.222.180.190:/opt/crossover/nginx-web.conf
#   docker rm -f crossover-web-1
#   docker run -d --name crossover-web-1 --restart unless-stopped --network shared-net \
#     -v /opt/crossover/website:/usr/share/nginx/html:ro \
#     -v /opt/crossover/nginx-web.conf:/etc/nginx/conf.d/default.conf:ro \
#     nginx:alpine
#
# TLS and gzip are handled upstream by transyol-caddy; this server only has to
# resolve paths, set cache lifetimes and hand back the right status codes.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Behind transyol-caddy nginx never sees the public host name, so the
    # trailing-slash redirect must be relative or it would send visitors to
    # the internal hostname.
    absolute_redirect off;

    # Routes the previous version of the site published and Google has indexed.
    # Their content lives on under new paths, so they move rather than 404.
    location = /dogrulama/   { return 301 /nasil-oynanir/; }
    location = /dogrulama    { return 301 /nasil-oynanir/; }
    location = /ozellikler/  { return 301 /oyun-modlari/; }
    location = /ozellikler   { return 301 /oyun-modlari/; }
    location /screens/       { return 301 /; }

    # /nasil-oynanir/ -> /nasil-oynanir/index.html, and a real 404 otherwise.
    location / {
        try_files $uri $uri/ =404;
    }

    # The branded 404 page, not nginx's default.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Fingerprint-free filenames, so HTML must always be revalidated: a deploy
    # has to be visible immediately.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
    location = / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Fonts never change once published.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Images change rarely; a day of caching with revalidation after that.
    location /img/ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        access_log off;
    }

    # CSS and JS are unversioned, so they revalidate hourly rather than being
    # pinned for a year — a style fix must not wait for a cache to expire.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }

    location = /robots.txt  { access_log off; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
    location = /app-ads.txt { add_header Cache-Control "public, max-age=86400"; }

    # Baseline hardening. No CSP here: the page loads Google AdSense, and a
    # policy tight enough to matter would have to allow most of it anyway.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
